<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic DOM Example</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 15px;
            margin: 10px;
        }
        ul {
            list-style-type: none;
        }
    </style>
</head>
<body>

    <h1 id="heading">Welcome</h1>
    <p id="message">Click the button to change this text.</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="addItem()">Add List Item</button>

    <ul id="list"></ul>

    <script>
        // Change text dynamically
        function changeText() {
            document.getElementById("heading").innerHTML = "Hello, Shivam!";
            document.getElementById("message").innerHTML = "Content updated using DOM.";
        }

        // Add new list item dynamically
        function addItem() {
            let ul = document.getElementById("list");
            let li = document.createElement("li");
            li.innerHTML = "New Item " + (ul.children.length + 1);
            ul.appendChild(li);
        }
    </script>

</body>
</html>
