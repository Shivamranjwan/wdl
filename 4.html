<!DOCTYPE html>
<html>
<head>
    <title>Pratical 4</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="4.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">Student Table</h1>

    <h2>Using Different Types of CSS</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>
        <tr class="highlight">
            <td>Shivam</td>
            <td>IT</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>CS</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
