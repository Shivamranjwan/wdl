<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="mini.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h2>Expense Tracker</h2>

    <h3>Balance: ₹<span id="balance">0</span></h3>

    <div class="summary">
        <div class="income">Income: ₹<span id="income">0</span></div>
        <div class="expense">Expense: ₹<span id="expense">0</span></div>
    </div>

    <h3>Add Transaction</h3>
    <input type="text" id="text" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount">

    <!-- Separate buttons -->
    <button onclick="addTransaction('income')">Add Income</button>
    <button onclick="addTransaction('expense')">Add Expense</button>

    <h3>History</h3>
    <ul id="list"></ul>

    <canvas id="chart"></canvas>
</div>

<script src="mini.js"></script>
</body>
</html>
